name: Actualizar Datos SNI Mazar Diariamente

on:
  schedule:
    # Cada 2 horas en el minuto 17 (hora UTC; Ecuador = UTC-5), sincronizado con
    # el robot del simulador "Cuenta regresiva Mazar" (luiscampozano/simulador-mazar)
    - cron: '17 */2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de actualización hidrológica y climática
        run: python actualizar_datos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar cambios en el sitio web
        run: |
          git config --global user.name "Monitor SNI Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add datos_sni.json
          git diff --staged --quiet || git commit -m "Auto-actualización SNI $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; echo "Otro cambio llegó al mismo tiempo; se reintenta en la próxima corrida"; exit 0; }
          git push
