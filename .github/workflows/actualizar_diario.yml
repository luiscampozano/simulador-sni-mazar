name: Actualizar Datos SNI Mazar Diariamente

on:
  schedule:
    # 14:45 UTC equivale exactamente a las 09:45 AM en Ecuador (UTC-5)
    - cron: '45 14 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de actualización hidrológica y climática
        run: python actualizar_datos.py

      - name: Guardar cambios en el sitio web
        run: |
          git config --global user.name "Monitor SNI Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add datos_sni.json
          git diff --staged --quiet || git commit -m "Auto-actualización diaria SNI $(date +'%Y-%m-%d')"
          git push
